name: Check
on: [push, pull_request]
jobs:
  library-and-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:editor
      - run: git diff --exit-code -- vendor/editor.js vendor/editor-LICENSES.txt
      - run: python scripts/assemble_library.py
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: node --test tests/*.test.cjs
      - run: node --check app.js && node --check pyworker.js
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_app.py
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: CI-Practice-macOS
          path: release/CI-Practice-macOS-*.zip
